description = "Interactive map: resorts and looked-up cities coloured by last known snowmaking tier. Driven by site.js."
==
<div id="map" class="screen__map-canvas" aria-label="Map of resorts and recently checked places. Click anywhere to check that spot."></div>
<script type="application/json" id="mapData">{{ mapPoints|json_encode|raw }}</script>

<div class="map-legend" aria-hidden="true">
    <span><i class="map-pin" data-tier="great"></i>Snowmaking</span>
    <span><i class="map-pin" data-tier="too_warm"></i>Too warm</span>
    <span><i class="map-pin map-pin--resort"></i>Resort</span>
    <span><i class="map-pin map-pin--stale" data-tier="great"></i>Not checked in 3h</span>
</div>
<p class="map-hint">Click a pin or anywhere on the map to check it.</p>
