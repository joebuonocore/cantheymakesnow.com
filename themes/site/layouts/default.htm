description = "Default layout"
==
<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-2QX58NHYF6"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-2QX58NHYF6');
        </script>
        <script>
            (function () {
                // Follow the OS colour scheme; custom.css uses the same media query.
                var query = window.matchMedia('(prefers-color-scheme: dark)');
                function apply() {
                    document.documentElement.setAttribute('data-bs-theme', query.matches ? 'dark' : 'light');
                }
                apply();
                if (query.addEventListener) {
                    query.addEventListener('change', apply);
                }

                // Apply the saved °F/°C choice before first paint.
                try {
                    if (localStorage.getItem('ctms.units') === 'c') {
                        document.documentElement.setAttribute('data-units', 'c');
                    }
                } catch (e) {}
            })();
        </script>

        <title>{{ this.page.meta_title }}</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="{{ this.page.meta_description }}" />
        <meta name="title" content="{{ this.page.meta_title }}" />
        <meta name="author" content="Joe Buonocore" />
        <meta name="ctms-maps-key" content="{{ env('GOOGLE_MAPS_BROWSER_KEY') ?: env('GOOGLE_MAPS_API_KEY') }}" />
        <meta name="ctms-map-id" content="{{ env('GOOGLE_MAPS_MAP_ID') ?: 'DEMO_MAP_ID' }}" />

        <link rel="canonical" href="https://cantheymakesnow.com{{ this.page.url }}" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Can They Make Snow?" />
        <meta property="og:title" content="{{ this.page.meta_title }}" />
        <meta property="og:description" content="{{ this.page.meta_description }}" />
        <meta property="og:url" content="https://cantheymakesnow.com{{ this.page.url }}" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="{{ this.page.meta_title }}" />
        <meta name="twitter:description" content="{{ this.page.meta_description }}" />

        <link rel="stylesheet" href="{{ ['assets/css/custom.css']|theme }}" />
        <link rel="stylesheet" href="{{ ['assets/css/tw.css']|theme }}" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <link rel="icon" type="image/x-icon" href="https://fav.farm/%E2%9D%84%EF%B8%8F">

        {% styles %}
    </head>
    <body class="screen-root">

        {% placeholder header %}

        {% page %}

        {% placeholder footer %}

        {% framework extras %}
        <script src="{{ ['assets/js/site.js']|theme }}"></script>
        {% scripts %}
    </body>
</html>
